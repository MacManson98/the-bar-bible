<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bar Bible - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            min-height: 100vh;
        }
        .header {
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-bottom: 2px solid #d4af37;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        h1 { color: #d4af37; font-size: 2.5em; }
        .subtitle { color: #999; margin-top: 5px; }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            border-bottom: 2px solid rgba(212,175,55,0.2);
        }
        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 16px;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab:hover { color: #d4af37; }
        .tab.active {
            color: #d4af37;
            border-bottom-color: #d4af37;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .search-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
        }
        .filter-select {
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            min-width: 150px;
        }
        .filter-select option { background: #2d2d2d; }
        
        .cocktail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .cocktail-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        .cocktail-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .cocktail-card:hover .cocktail-actions {
            opacity: 1;
        }
        .action-btn {
            background: rgba(212,175,55,0.2);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .action-btn:hover {
            background: rgba(212,175,55,0.3);
        }
        .action-btn.delete {
            background: rgba(255,0,0,0.2);
            border-color: rgba(255,0,0,0.5);
            color: #ff6b6b;
        }
        .action-btn.delete:hover {
            background: rgba(255,0,0,0.3);
        }
        .cocktail-card:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
            box-shadow: 0 5px 20px rgba(212,175,55,0.3);
        }
        .cocktail-name {
            font-size: 1.3em;
            color: #d4af37;
            margin-bottom: 10px;
        }
        .cocktail-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .meta-tag {
            background: rgba(212,175,55,0.2);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #d4af37;
        }
        
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            margin-bottom: 8px;
            color: #d4af37;
            font-weight: 500;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #d4af37;
            background: rgba(0,0,0,0.6);
        }
        select option { background: #2d2d2d; color: #fff; }
        textarea { min-height: 120px; resize: vertical; }
        
        .ingredient-row {
            display: grid;
            grid-template-columns: 2fr 1fr 2fr auto;
            gap: 10px;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            align-items: center;
            position: relative;
        }
        .autocomplete-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #2d2d2d;
            border: 1px solid #d4af37;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(212,175,55,0.4);
        }
        .autocomplete-suggestion {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }
        .autocomplete-suggestion:hover {
            background: rgba(212,175,55,0.2);
        }
        .autocomplete-suggestion:last-child {
            border-bottom: none;
        }
        .ingredient-header {
            display: grid;
            grid-template-columns: 2fr 1fr 2fr auto;
            gap: 10px;
            margin-bottom: 10px;
            font-weight: 600;
            color: #d4af37;
        }
        .add-ingredient-btn {
            background: rgba(212,175,55,0.2);
            border: 2px dashed #d4af37;
            color: #d4af37;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
            width: 100%;
        }
        .add-ingredient-btn:hover {
            background: rgba(212,175,55,0.3);
            border-style: solid;
        }
        .submit-btn {
            background: linear-gradient(135deg, #d4af37 0%, #b8941f 100%);
            color: #1a1a1a;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212,175,55,0.4);
        }
        .remove-btn {
            background: rgba(255,0,0,0.2);
            border: 1px solid rgba(255,0,0,0.5);
            color: #ff6b6b;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .remove-btn:hover { background: rgba(255,0,0,0.3); }
        
        .cocktail-form-container { margin-bottom: 20px; }
        .cocktail-form-collapsed {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(212,175,55,0.2);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .cocktail-form-collapsed:hover {
            border-color: #d4af37;
            background: rgba(255,255,255,0.08);
        }
        .cocktail-form-expanded {
            background: rgba(255,255,255,0.05);
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 25px;
        }
        .collapsed-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .collapsed-title {
            font-size: 1.3em;
            color: #d4af37;
        }
        .collapsed-meta {
            color: #999;
            font-size: 14px;
            margin-top: 5px;
        }
        .remove-cocktail-btn {
            background: rgba(255,0,0,0.2);
            border: 1px solid rgba(255,0,0,0.5);
            color: #ff6b6b;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .remove-cocktail-btn:hover { background: rgba(255,0,0,0.3); }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(212,175,55,0.1);
            border: 1px solid rgba(212,175,55,0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 2.5em;
            color: #d4af37;
            font-weight: bold;
        }
        .stat-label {
            color: #999;
            margin-top: 5px;
        }
        .section-title {
            color: #d4af37;
            font-size: 1.3em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(212,175,55,0.3);
        }
        
        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .loading-overlay.active {
            display: flex;
        }
        .loading-content {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(212,175,55,0.2);
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #d4af37;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .loading-subtext {
            color: #999;
            font-size: 0.9em;
        }
        
        /* Edit Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            overflow-y: auto;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #2d2d2d;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 30px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            margin: 20px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title {
            color: #d4af37;
            font-size: 1.8em;
        }
        .modal-close {
            background: rgba(255,0,0,0.2);
            border: 1px solid rgba(255,0,0,0.5);
            color: #ff6b6b;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .modal-close:hover {
            background: rgba(255,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>🍸 The Bar Bible</h1>
            <p class="subtitle">Admin Dashboard</p>
        </div>
    </div>
    
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('browse')">Browse Cocktails</button>
            <button class="tab" onclick="switchTab('add')">Add Cocktails</button>
        </div>
        
        <div id="browse-tab" class="tab-content active">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="total-cocktails">0</div>
                    <div class="stat-label">Total Cocktails</div>
                </div>
            </div>
            
            <div class="search-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="Search cocktails...">
                <select class="filter-select" id="spiritFilter">
                    <option value="">All Spirits</option>
                    <option value="Vodka">Vodka</option>
                    <option value="Gin">Gin</option>
                    <option value="Rum">Rum</option>
                    <option value="Whiskey">Whiskey</option>
                    <option value="Tequila">Tequila</option>
                    <option value="Brandy">Brandy</option>
                    <option value="Other">Other</option>
                </select>
                <select class="filter-select" id="methodFilter">
                    <option value="">All Methods</option>
                    <option value="Shake">Shake</option>
                    <option value="Stir">Stir</option>
                    <option value="Build">Build</option>
                    <option value="Roll">Roll</option>
                </select>
                <select class="filter-select" id="sortBy">
                    <option value="name">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="date-new">Newest First</option>
                    <option value="date-old">Oldest First</option>
                    <option value="difficulty">Difficulty (Low-High)</option>
                    <option value="difficulty-desc">Difficulty (High-Low)</option>
                </select>
            </div>
            
            <div id="cocktails-grid" class="cocktail-grid">
                <p style="color: #999;">Loading cocktails...</p>
            </div>
        </div>
        
        <div id="add-tab" class="tab-content">
            <div id="cocktails-container"></div>
            
            <button class="add-ingredient-btn" onclick="addCocktailForm()" style="margin: 20px 0;">
                + Add Another Cocktail
            </button>
            
            <button class="submit-btn" onclick="submitAllCocktails()" id="submitAllBtn" style="display:none;">
                🍸 Submit All Cocktails (<span id="cocktailCount">0</span>)
            </button>
        </div>
    </div>
    
    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text">Submitting Cocktails...</div>
            <div class="loading-subtext" id="loadingProgress">0 / 0</div>
        </div>
    </div>
    
    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Edit Cocktail</h2>
                <button class="modal-close" onclick="closeEditModal()">Close</button>
            </div>
            <div id="editFormContainer"></div>
        </div>
    </div>
    
    <script>
        let cocktailForms = [];
        let currentFormId = 0;
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            if (tab === 'browse') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('browse-tab').classList.add('active');
                loadCocktails();
            } else if (tab === 'add') {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('add-tab').classList.add('active');
                if (cocktailForms.length === 0) addCocktailForm();
            }
        }
        
        async function loadCocktails() {
            try {
                const response = await fetch('https://n8n.maclusky.co.uk/webhook/get-cocktails');
                const data = await response.json();
                const cocktails = Array.isArray(data) ? data : (data.list || []);
                document.getElementById('total-cocktails').textContent = cocktails.length;
                renderCocktails(cocktails);
            } catch (error) {
                document.getElementById('cocktails-grid').innerHTML = 
                    '<p style="color: #ff6b6b;">Error: ' + error.message + '</p>';
            }
        }
        
        function renderCocktails(cocktails) {
            const grid = document.getElementById('cocktails-grid');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const spiritFilter = document.getElementById('spiritFilter').value;
            const methodFilter = document.getElementById('methodFilter').value;
            const sortBy = document.getElementById('sortBy').value;
            
            let filtered = cocktails.filter(c => {
                const matchesSearch = c.name?.toLowerCase().includes(searchTerm) || c.tags?.toLowerCase().includes(searchTerm);
                const matchesSpirit = !spiritFilter || c.base_spirit === spiritFilter;
                const matchesMethod = !methodFilter || c.method === methodFilter;
                return matchesSearch && matchesSpirit && matchesMethod;
            });
            
            filtered.sort((a, b) => {
                switch(sortBy) {
                    case 'name': return (a.name || '').localeCompare(b.name || '');
                    case 'name-desc': return (b.name || '').localeCompare(a.name || '');
                    case 'date-new': return (b.cocktail_id || 0) - (a.cocktail_id || 0);
                    case 'date-old': return (a.cocktail_id || 0) - (b.cocktail_id || 0);
                    case 'difficulty': return (a.difficulty || 0) - (b.difficulty || 0);
                    case 'difficulty-desc': return (b.difficulty || 0) - (a.difficulty || 0);
                    default: return 0;
                }
            });
            
            grid.innerHTML = filtered.length === 0 ? '<p style="color: #999;">No cocktails found.</p>' :
                filtered.map(c => `
                    <div class="cocktail-card" onclick="event.target.classList.contains('action-btn') ? null : viewCocktail(${c.cocktail_id})">
                        <div class="cocktail-actions">
                            <button class="action-btn" onclick="event.stopPropagation(); editCocktail(${c.cocktail_id})">Edit</button>
                            <button class="action-btn delete" onclick="event.stopPropagation(); deleteCocktail(${c.cocktail_id}, '${c.name?.replace(/'/g, "\\'")}')">Delete</button>
                        </div>
                        <div class="cocktail-name">${c.name || 'Unnamed'}</div>
                        <div class="cocktail-meta">
                            <span class="meta-tag">${c.base_spirit || 'Unknown'}</span>
                            <span class="meta-tag">${c.method || 'N/A'}</span>
                            <span class="meta-tag">${c.glass || 'N/A'}</span>
                            <span class="meta-tag">${'★'.repeat(c.difficulty || 1)}</span>
                        </div>
                        ${c.tags ? `<div style="color: #999; margin-top: 10px; font-size: 14px;">${c.tags}</div>` : ''}
                    </div>
                `).join('');
        }

        let ingredientsList = [];
        let garnishesList = [];

// Load ingredients on page load
async function loadIngredients() {
    try {
        const response = await fetch('https://n8n.maclusky.co.uk/webhook/get-ingredients');
        const data = await response.json();
        ingredientsList = data.map(i => i.name);
    } catch (error) {
        console.error('Failed to load ingredients:', error);
    }
}

// Load garnishes
async function loadGarnishes() {
    try {
        const response = await fetch('https://n8n.maclusky.co.uk/webhook/get-garnishes');
        const data = await response.json();
        garnishesList = data.map(g => g.name);
    } catch (error) {
        console.error('Failed to load garnishes:', error);
    }
}

// Custom autocomplete
function setupAutocomplete(input, suggestionsList) {
    let currentFocus = -1;
    
    input.addEventListener('input', function() {
        const val = this.value.toLowerCase();
        closeAllLists();
        
        if (!val || val.length < 2) return;
        
        const matches = suggestionsList.filter(name => 
            name.toLowerCase().includes(val)
        ).slice(0, 8);
        
        if (matches.length === 0) return;
        
        const listDiv = document.createElement('div');
        listDiv.className = 'autocomplete-suggestions';
        listDiv.id = 'autocomplete-list';
        
        matches.forEach(name => {
            const div = document.createElement('div');
            div.className = 'autocomplete-suggestion';
            div.textContent = name;
            div.addEventListener('click', function() {
                input.value = name;
                closeAllLists();
            });
            listDiv.appendChild(div);
        });
        
        this.parentNode.appendChild(listDiv);
    });
    
    input.addEventListener('keydown', function(e) {
        let list = document.getElementById('autocomplete-list');
        if (!list) return;
        const items = list.getElementsByClassName('autocomplete-suggestion');
        
        if (e.keyCode === 40) { // Down
            e.preventDefault();
            currentFocus++;
            addActive(items);
        } else if (e.keyCode === 38) { // Up
            e.preventDefault();
            currentFocus--;
            addActive(items);
        } else if (e.keyCode === 13) { // Enter
            e.preventDefault();
            if (currentFocus > -1 && items[currentFocus]) {
                items[currentFocus].click();
            }
        }
    });
    
    function addActive(items) {
        if (!items) return;
        removeActive(items);
        if (currentFocus >= items.length) currentFocus = 0;
        if (currentFocus < 0) currentFocus = items.length - 1;
        items[currentFocus].style.background = 'rgba(212,175,55,0.3)';
    }
    
    function removeActive(items) {
        for (let i = 0; i < items.length; i++) {
            items[i].style.background = '';
        }
    }
    
    function closeAllLists() {
        const lists = document.getElementsByClassName('autocomplete-suggestions');
        while(lists.length > 0) {
            lists[0].remove();
        }
        currentFocus = -1;
    }
    
    document.addEventListener('click', function(e) {
        if (e.target !== input) closeAllLists();
    });
}
        
        document.getElementById('searchInput').addEventListener('input', loadCocktails);
        document.getElementById('spiritFilter').addEventListener('change', loadCocktails);
        document.getElementById('methodFilter').addEventListener('change', loadCocktails);
        document.getElementById('sortBy').addEventListener('change', loadCocktails);
        
        function createCocktailForm(id) {
            return `<div class="cocktail-form-container" id="form-${id}"><div class="cocktail-form-expanded">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 class="section-title" style="margin: 0;">Cocktail ${id + 1}</h2>
                    <button class="remove-cocktail-btn" onclick="removeCocktailForm(${id})">Remove</button>
                </div>
                <div class="form-group"><label>Cocktail Name *</label><input type="text" name="name" required placeholder="e.g., Old Fashioned" data-form="${id}"></div>
                <div class="form-group"><label>Method *</label><select name="method" required data-form="${id}">
                    <option value="">Select method...</option><option value="Shake">Shake</option><option value="Stir">Stir</option><option value="Build">Build</option><option value="Roll">Roll</option>
                </select></div>
                <div class="form-group"><label>Method Instructions *</label><textarea name="method_instructions" required placeholder="Detailed preparation instructions..." data-form="${id}"></textarea></div>
                <div class="form-group"><label>Garnish</label><div style="position: relative;"><input type="text" name="garnish" placeholder="e.g., Orange twist" data-form="${id}" class="garnish-autocomplete" autocomplete="off"></div></div>
                <div class="form-group"><label>Glass Type *</label><select name="glass" required data-form="${id}">
                    <option value="">Select glass...</option><option value="Coupe">Coupe</option><option value="Rocks">Rocks</option><option value="Highball">Highball</option><option value="Flute">Flute</option><option value="Collins">Collins</option><option value="Martini">Martini</option>
                </select></div>
                <div class="form-group"><label>Ice Type</label><select name="ice" data-form="${id}">
                    <option value="">Select ice...</option><option value="Cubed">Cubed</option><option value="Crushed">Crushed</option><option value="Cracked">Cracked</option><option value="None">None</option>
                </select></div>
                <div class="form-group"><label>Difficulty (1-5) *</label><select name="difficulty" required data-form="${id}">
                    <option value="">Select difficulty...</option><option value="1">1 - Very Easy</option><option value="2">2 - Easy</option><option value="3">3 - Moderate</option><option value="4">4 - Difficult</option><option value="5">5 - Very Difficult</option>
                </select></div>
                <div class="form-group"><label>Base Spirit *</label><select name="base_spirit" required data-form="${id}">
                    <option value="">Select base spirit...</option><option value="Vodka">Vodka</option><option value="Gin">Gin</option><option value="Rum">Rum</option><option value="Whiskey">Whiskey</option><option value="Tequila">Tequila</option><option value="Brandy">Brandy</option><option value="Wine">Wine</option><option value="Cachaca">Cachaça</option><option value="Other">Other</option>
                </select></div>
                <div class="form-group"><label>Tags (comma-separated)</label><input type="text" name="tags" placeholder="e.g., classic,spirit-forward,bitter" data-form="${id}"></div>
                <div class="form-group"><label>History/Description</label><textarea name="history" placeholder="Origin story and historical context..." data-form="${id}"></textarea></div>
                <h3 class="section-title">Ingredients</h3>
                <div class="ingredient-header"><div>Ingredient Name</div><div>Amount (ml)</div><div></div></div>
                <div id="ingredients-${id}">
                    <div class="ingredient-row">
                        <input type="text" name="ingredient_name" placeholder="e.g., Bourbon" required data-form="${id}" class="ingredient-autocomplete" autocomplete="off">
                        <input type="text" name="amount_ml" placeholder="45" required data-form="${id}">
                    </div>
                </div>
                <button type="button" class="add-ingredient-btn" onclick="addIngredient(${id})">+ Add Ingredient</button>
                <button class="submit-btn" onclick="collapseCocktailForm(${id})" style="margin-top: 20px;">✓ Done - Collapse This Cocktail</button>
            </div></div>`;
        }
        
        function addCocktailForm() {
            document.getElementById('cocktails-container').insertAdjacentHTML('beforeend', createCocktailForm(currentFormId));
            cocktailForms.push({ id: currentFormId, collapsed: false });
            
            // Setup autocomplete for the new ingredient input
            const newIngredientInput = document.querySelector(`[name="ingredient_name"][data-form="${currentFormId}"]`);
            if (newIngredientInput) setupAutocomplete(newIngredientInput, ingredientsList);
            
            // Setup autocomplete for garnish
            const newGarnishInput = document.querySelector(`[name="garnish"][data-form="${currentFormId}"]`);
            if (newGarnishInput) setupAutocomplete(newGarnishInput, garnishesList);
            
            currentFormId++;
            updateSubmitButton();
        }
        
        function addIngredient(formId) {
            const container = document.getElementById(`ingredients-${formId}`);
            const row = document.createElement('div');
            row.className = 'ingredient-row';
            row.innerHTML = `<input type="text" name="ingredient_name" placeholder="e.g., Simple Syrup" required data-form="${formId}" class="ingredient-autocomplete" autocomplete="off">
                <input type="text" name="amount_ml" placeholder="15" required data-form="${formId}">
                <button type="button" class="remove-btn" onclick="this.parentElement.remove()">Remove</button>`;
            container.appendChild(row);
            
            // Setup autocomplete for the new input
            const newInput = row.querySelector('.ingredient-autocomplete');
            if (newInput) setupAutocomplete(newInput, ingredientsList);
        }
        
        function collapseCocktailForm(id) {
            const formData = getFormData(id);
            if (!formData.name) return alert('Please enter a cocktail name first');
            
            const ingredientCount = formData.ingredient_name.length;
            document.getElementById(`form-${id}`).innerHTML = `
                <div class="cocktail-form-collapsed" onclick="expandCocktailForm(${id})">
                    <div class="collapsed-summary">
                        <div><div class="collapsed-title">${formData.name}</div>
                        <div class="collapsed-meta">${formData.base_spirit} • ${formData.method} • ${ingredientCount} ingredients</div></div>
                        <button class="remove-cocktail-btn" onclick="event.stopPropagation(); removeCocktailForm(${id})">Remove</button>
                    </div>
                </div>`;
            
            cocktailForms.find(f => f.id === id).collapsed = true;
            cocktailForms.find(f => f.id === id).data = formData;
            updateSubmitButton();
        }
        
        function expandCocktailForm(id) {
            const form = cocktailForms.find(f => f.id === id);
            document.getElementById(`form-${id}`).innerHTML = createCocktailForm(id).replace(`<div class="cocktail-form-container" id="form-${id}">`, '').replace(/<\/div>$/, '');
            
            if (form.data) {
                Object.keys(form.data).forEach(key => {
                    if (key === 'ingredient_name' || key === 'amount_ml' || key === 'prep_note') {
                        form.data[key].forEach((val, i) => {
                            if (i > 0) addIngredient(id);
                            const inputs = document.querySelectorAll(`[name="${key}"][data-form="${id}"]`);
                            if (inputs[i]) inputs[i].value = val;
                        });
                    } else {
                        const input = document.querySelector(`[name="${key}"][data-form="${id}"]`);
                        if (input) input.value = form.data[key];
                    }
                });
            }
            form.collapsed = false;
        }
        
        function removeCocktailForm(id) {
            if (confirm('Remove this cocktail?')) {
                document.getElementById(`form-${id}`).remove();
                cocktailForms = cocktailForms.filter(f => f.id !== id);
                updateSubmitButton();
            }
        }
        
        function getFormData(id) {
            const data = {};
            document.querySelectorAll(`[data-form="${id}"]`).forEach(input => {
                const name = input.getAttribute('name');
                const value = input.value;
                if (name === 'ingredient_name' || name === 'amount_ml' || name === 'prep_note') {
                    if (!data[name]) data[name] = [];
                    if (value) data[name].push(value);
                } else {
                    data[name] = value;
                }
            });
            return data;
        }
        
        function updateSubmitButton() {
            const count = cocktailForms.length;
            document.getElementById('cocktailCount').textContent = count;
            document.getElementById('submitAllBtn').style.display = count > 0 ? 'block' : 'none';
        }
        
        async function submitAllCocktails() {
            const allData = cocktailForms.map(f => f.collapsed ? f.data : getFormData(f.id));
            let success = 0, failed = 0;
            
            // Show loading overlay
            const overlay = document.getElementById('loadingOverlay');
            const progressText = document.getElementById('loadingProgress');
            overlay.classList.add('active');
            
            // Small delay to ensure overlay renders
            await new Promise(resolve => setTimeout(resolve, 100));
            
            for (let i = 0; i < allData.length; i++) {
                const data = allData[i];
                
                // Update progress
                progressText.textContent = `${i + 1} / ${allData.length}`;
                
                try {
                    const response = await fetch(window.location.href, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    if (response.ok) success++; else failed++;
                } catch (error) { 
                    failed++;
                }
                
                // Small delay between submissions so user can see progress
                await new Promise(resolve => setTimeout(resolve, 200));
            }
            
            // Hide loading overlay
            overlay.classList.remove('active');
            
            alert(`✅ Submitted!\n${success} cocktails added\n${failed} failed`);
            window.location.reload();
        }
        
        function viewCocktail(id) {
            // Click card opens edit modal
            editCocktail(id);
        }
        
        async function editCocktail(id) {
            const overlay = document.getElementById('loadingOverlay');
            overlay.querySelector('.loading-text').textContent = 'Loading cocktail...';
            overlay.classList.add('active');

            try {
                // Fetch cocktail data
                const cocktailResponse = await fetch('https://n8n.maclusky.co.uk/webhook/get-cocktails');
                const cocktails = await cocktailResponse.json();

                // ✅ Fix type mismatch (id from HTML is a string)
                const cocktail = cocktails.find(c => String(c.cocktail_id) === String(id));

                if (!cocktail) {
                overlay.classList.remove('active');
                alert('Cocktail not found!');
                return;
                }

                // ✅ Use the NEW endpoint for this cocktail’s ingredient rows
                const ingredientsResponse = await fetch(
                `https://n8n.maclusky.co.uk/webhook/get-cocktail-ingredients?cocktail_id=${encodeURIComponent(id)}`
                );
                const ingredients = await ingredientsResponse.json();

                overlay.classList.remove('active');
                overlay.querySelector('.loading-text').textContent = 'Submitting Cocktails...';

                // Show edit modal
                showEditModal(cocktail, ingredients);
            } catch (error) {
                overlay.classList.remove('active');
                alert('❌ Error loading cocktail: ' + error.message);
            }
            }

        
        function showEditModal(cocktail, ingredients) {
            const modal = document.getElementById('editModal');
            const container = document.getElementById('editFormContainer');
            
            // Build ingredients rows HTML
            const ingredientsHTML = ingredients.map((ing, i) => `
                <div class="ingredient-row">
                    <input type="text" name="ingredient_name" value="${ing.ingredient_name}" required data-ing-id="${ing.Id || ''}">
                    <input type="text" name="amount_ml" value="${ing.amount_ml}" required>
                    <button type="button" class="remove-btn" onclick="this.parentElement.remove()">Remove</button>
                </div>
            `).join('');
            
            container.innerHTML = `
                <div class="form-section">
                    <div class="form-group">
                        <label>Cocktail Name *</label>
                        <input type="text" id="edit-name" value="${cocktail.name}" required>
                    </div>
                    <div class="form-group">
                        <label>Method *</label>
                        <select id="edit-method" required>
                            <option value="Shake" ${cocktail.method === 'Shake' ? 'selected' : ''}>Shake</option>
                            <option value="Stir" ${cocktail.method === 'Stir' ? 'selected' : ''}>Stir</option>
                            <option value="Build" ${cocktail.method === 'Build' ? 'selected' : ''}>Build</option>
                            <option value="Roll" ${cocktail.method === 'Roll' ? 'selected' : ''}>Roll</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Method Instructions *</label>
                        <textarea id="edit-method-instructions" required>${cocktail.method_instructions || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Garnish</label>
                        <input type="text" id="edit-garnish" value="${cocktail.garnish || ''}">
                    </div>
                    <div class="form-group">
                        <label>Glass Type *</label>
                        <select id="edit-glass" required>
                            <option value="Coupe" ${cocktail.glass === 'Coupe' ? 'selected' : ''}>Coupe</option>
                            <option value="Rocks" ${cocktail.glass === 'Rocks' ? 'selected' : ''}>Rocks</option>
                            <option value="Highball" ${cocktail.glass === 'Highball' ? 'selected' : ''}>Highball</option>
                            <option value="Flute" ${cocktail.glass === 'Flute' ? 'selected' : ''}>Flute</option>
                            <option value="Collins" ${cocktail.glass === 'Collins' ? 'selected' : ''}>Collins</option>
                            <option value="Martini" ${cocktail.glass === 'Martini' ? 'selected' : ''}>Martini</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ice Type</label>
                        <select id="edit-ice">
                            <option value="">Select ice...</option>
                            <option value="Cubed" ${cocktail.ice === 'Cubed' ? 'selected' : ''}>Cubed</option>
                            <option value="Crushed" ${cocktail.ice === 'Crushed' ? 'selected' : ''}>Crushed</option>
                            <option value="Cracked" ${cocktail.ice === 'Cracked' ? 'selected' : ''}>Cracked</option>
                            <option value="None" ${cocktail.ice === 'None' ? 'selected' : ''}>None</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Difficulty (1-5) *</label>
                        <select id="edit-difficulty" required>
                            <option value="1" ${cocktail.difficulty === 1 ? 'selected' : ''}>1 - Very Easy</option>
                            <option value="2" ${cocktail.difficulty === 2 ? 'selected' : ''}>2 - Easy</option>
                            <option value="3" ${cocktail.difficulty === 3 ? 'selected' : ''}>3 - Moderate</option>
                            <option value="4" ${cocktail.difficulty === 4 ? 'selected' : ''}>4 - Difficult</option>
                            <option value="5" ${cocktail.difficulty === 5 ? 'selected' : ''}>5 - Very Difficult</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Base Spirit *</label>
                        <select id="edit-base-spirit" required>
                            <option value="Vodka" ${cocktail.base_spirit === 'Vodka' ? 'selected' : ''}>Vodka</option>
                            <option value="Gin" ${cocktail.base_spirit === 'Gin' ? 'selected' : ''}>Gin</option>
                            <option value="Rum" ${cocktail.base_spirit === 'Rum' ? 'selected' : ''}>Rum</option>
                            <option value="Whiskey" ${cocktail.base_spirit === 'Whiskey' ? 'selected' : ''}>Whiskey</option>
                            <option value="Tequila" ${cocktail.base_spirit === 'Tequila' ? 'selected' : ''}>Tequila</option>
                            <option value="Brandy" ${cocktail.base_spirit === 'Brandy' ? 'selected' : ''}>Brandy</option>
                            <option value="Wine" ${cocktail.base_spirit === 'Wine' ? 'selected' : ''}>Wine</option>
                            <option value="Cachaca" ${cocktail.base_spirit === 'Cachaca' ? 'selected' : ''}>Cachaça</option>
                            <option value="Other" ${cocktail.base_spirit === 'Other' ? 'selected' : ''}>Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tags (comma-separated)</label>
                        <input type="text" id="edit-tags" value="${cocktail.tags || ''}">
                    </div>
                    <div class="form-group">
                        <label>History/Description</label>
                        <textarea id="edit-history">${cocktail.history || ''}</textarea>
                    </div>
                    
                    <h3 class="section-title">Ingredients</h3>
                    <div class="ingredient-header">
                        <div>Ingredient Name</div>
                        <div>Amount (ml)</div>
                        <div></div>
                    </div>
                    <div id="edit-ingredients-container">
                        ${ingredientsHTML}
                    </div>
                    <button type="button" class="add-ingredient-btn" onclick="addEditIngredient()">+ Add Ingredient</button>
                    
                    <button class="submit-btn" onclick="saveEditedCocktail(${cocktail.cocktail_id})" style="margin-top: 20px;">✅ Save Changes</button>
                </div>
            `;
            
            modal.classList.add('active');
        }
        
        function addEditIngredient() {
            const container = document.getElementById('edit-ingredients-container');
            const row = document.createElement('div');
            row.className = 'ingredient-row';
            row.innerHTML = `
                <input type="text" name="ingredient_name" placeholder="e.g., Simple Syrup" required>
                <input type="text" name="amount_ml" placeholder="15" required>
                <button type="button" class="remove-btn" onclick="this.parentElement.remove()">Remove</button>
            `;
            container.appendChild(row);
        }
        
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }
        
        async function saveEditedCocktail(cocktailId) {
            const overlay = document.getElementById('loadingOverlay');
            overlay.querySelector('.loading-text').textContent = 'Saving changes...';
            overlay.classList.add('active');
            
            try {
                // Get form data
                const cocktailData = {
                    name: document.getElementById('edit-name').value,
                    method: document.getElementById('edit-method').value,
                    method_instructions: document.getElementById('edit-method-instructions').value,
                    garnish: document.getElementById('edit-garnish').value,
                    glass: document.getElementById('edit-glass').value,
                    ice: document.getElementById('edit-ice').value,
                    difficulty: parseInt(document.getElementById('edit-difficulty').value),
                    base_spirit: document.getElementById('edit-base-spirit').value,
                    tags: document.getElementById('edit-tags').value,
                    history: document.getElementById('edit-history').value
                };
                
                // Get ingredients
                const ingredientRows = document.querySelectorAll('#edit-ingredients-container .ingredient-row');
                const ingredients = Array.from(ingredientRows).map(row => ({
                    ingredient_name: row.querySelector('[name="ingredient_name"]').value,
                    amount_ml: row.querySelector('[name="amount_ml"]').value,
                }));
                
                // Send update request to n8n
                const response = await fetch('https://n8n.maclusky.co.uk/webhook/update-cocktail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cocktail_id: cocktailId,
                        cocktail: cocktailData,
                        ingredients: ingredients
                    })
                });
                alert('TEST - File loaded at: ' + new Date().toString());
                if (!response.ok) throw new Error('Update failed');
                
                alert('✅ Cocktail updated successfully!');
                closeEditModal();
                overlay.classList.remove('active');
                window.location.reload();
            } catch (error) {
                overlay.classList.remove('active');
                alert('❌ Error saving cocktail: ' + error.message);
            }
        }
        
        async function deleteCocktail(id, name) {
            if (!confirm(`Are you sure you want to delete "${name}"?\n\nThis action cannot be undone.`)) {
                return;
            }
            
            const overlay = document.getElementById('loadingOverlay');
            overlay.querySelector('.loading-text').textContent = 'Deleting cocktail...';
            overlay.classList.add('active');
            
            try {
                // Send delete request to n8n
                const response = await fetch('https://n8n.maclusky.co.uk/webhook/delete-cocktail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cocktail_id: id })
                });
                
                if (!response.ok) throw new Error('Delete failed');
                
                alert(`✅ "${name}" has been deleted!`);
                window.location.reload();
            } catch (error) {
                alert('❌ Error deleting cocktail: ' + error.message);
            } finally {
                overlay.classList.remove('active');
                overlay.querySelector('.loading-text').textContent = 'Submitting Cocktails...';
            }
        }
        
        loadCocktails();
        loadIngredients();
        loadGarnishes();
    </script>
</body>
</html>

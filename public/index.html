<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bar Bible — Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #fff; min-height: 100vh; }
    .header { background: rgba(0,0,0,0.6); padding: 20px 30px; border-bottom: 2px solid #d4af37; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .header h1 { color: #d4af37; font-size: 1.8em; }
    .header span { color: #999; font-size: 0.9em; }
    .header-user { display: flex; align-items: center; gap: 12px; }
    .header-email { color: #999; font-size: 13px; }
    .btn-signout { background: transparent; border: 1px solid rgba(212,175,55,0.3); color: #d4af37; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .btn-signout:hover { border-color: #d4af37; }
    .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
    .tabs { display: flex; gap: 0; margin-bottom: 30px; border-bottom: 2px solid rgba(212,175,55,0.2); }
    .tab { padding: 12px 28px; background: transparent; border: none; color: #999; cursor: pointer; font-size: 15px; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .tab:hover { color: #d4af37; }
    .tab.active { color: #d4af37; border-bottom-color: #d4af37; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Login screen */
    .login-screen { display: none; position: fixed; inset: 0; background: #111; z-index: 10000; justify-content: center; align-items: center; }
    .login-screen.active { display: flex; }
    .login-box { background: #1a1a1a; border: 1px solid #d4af37; border-radius: 16px; padding: 40px; width: 100%; max-width: 380px; }
    .login-logo { text-align: center; margin-bottom: 30px; }
    .login-logo h1 { color: #d4af37; font-size: 2em; }
    .login-logo p { color: #666; font-size: 13px; margin-top: 6px; }
    .login-group { margin-bottom: 18px; }
    .login-group label { display: block; color: #d4af37; font-size: 13px; font-weight: 500; margin-bottom: 7px; }
    .login-group input { width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.5); border: 1px solid rgba(212,175,55,0.25); border-radius: 8px; color: #fff; font-size: 15px; }
    .login-group input:focus { outline: none; border-color: #d4af37; }
    .btn-login { width: 100%; background: linear-gradient(135deg, #d4af37, #b8941f); color: #111; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: transform 0.2s; }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(212,175,55,0.3); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .login-error { color: #ff6b6b; font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }

    /* Browse */
    .search-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-input, .filter-select { padding: 10px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.3); border-radius: 6px; color: #fff; font-size: 14px; }
    .search-input { flex: 1; min-width: 200px; }
    .filter-select option { background: #222; }
    .stats { display: flex; gap: 15px; margin-bottom: 25px; }
    .stat { background: rgba(212,175,55,0.08); border: 1px solid rgba(212,175,55,0.2); border-radius: 10px; padding: 15px 25px; text-align: center; }
    .stat-num { font-size: 2em; color: #d4af37; font-weight: bold; }
    .stat-label { color: #999; font-size: 12px; margin-top: 3px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(212,175,55,0.15); border-radius: 10px; padding: 18px; cursor: pointer; transition: all 0.2s; position: relative; }
    .card:hover { border-color: #d4af37; transform: translateY(-2px); box-shadow: 0 4px 20px rgba(212,175,55,0.15); }
    .card-name { color: #d4af37; font-size: 1.1em; font-weight: 600; margin-bottom: 8px; }
    .card-meta { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: rgba(212,175,55,0.12); color: #d4af37; padding: 3px 10px; border-radius: 4px; font-size: 11px; }
    .tag.premium { background: rgba(255,215,0,0.2); }
    .card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
    .card:hover .card-actions { opacity: 1; }
    .btn-sm { padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; border: 1px solid; }
    .btn-edit { background: rgba(212,175,55,0.15); border-color: #d4af37; color: #d4af37; }
    .btn-delete { background: rgba(255,80,80,0.15); border-color: rgba(255,80,80,0.5); color: #ff6b6b; }

    /* Form */
    .form-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(212,175,55,0.2); border-radius: 12px; padding: 25px; margin-bottom: 20px; }
    .form-card h2 { color: #d4af37; font-size: 1.2em; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(212,175,55,0.2); display: flex; justify-content: space-between; align-items: center; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-grid.three { grid-template-columns: 1fr 1fr 1fr; }
    .form-group { margin-bottom: 0; }
    .form-group.full { grid-column: 1 / -1; }
    label { display: block; color: #d4af37; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    input[type=text], input[type=number], textarea, select {
      width: 100%; padding: 10px 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(212,175,55,0.25);
      border-radius: 6px; color: #fff; font-size: 14px; font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #d4af37; }
    textarea { min-height: 90px; resize: vertical; }
    select option { background: #222; }
    .toggle-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
    .toggle { position: relative; width: 44px; height: 24px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: #444; border-radius: 24px; cursor: pointer; transition: 0.3s; }
    .toggle-slider:before { content: ''; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
    input:checked + .toggle-slider { background: #d4af37; }
    input:checked + .toggle-slider:before { transform: translateX(20px); }
    .toggle-label { color: #ccc; font-size: 14px; }

    /* Ingredients */
    .ing-header { display: grid; grid-template-columns: 2fr 1fr 1.5fr 80px; gap: 8px; padding: 0 0 6px; border-bottom: 1px solid rgba(212,175,55,0.15); margin-bottom: 8px; }
    .ing-header span { color: #d4af37; font-size: 12px; font-weight: 600; }
    .ing-row { display: grid; grid-template-columns: 2fr 1fr 1.5fr 80px; gap: 8px; margin-bottom: 8px; align-items: center; }
    .btn-remove-ing { background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.4); color: #ff6b6b; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 12px; width: 100%; }
    .btn-add-ing { width: 100%; padding: 10px; background: transparent; border: 2px dashed rgba(212,175,55,0.3); border-radius: 6px; color: #d4af37; cursor: pointer; font-size: 13px; margin-top: 8px; transition: all 0.2s; }
    .btn-add-ing:hover { border-color: #d4af37; background: rgba(212,175,55,0.05); }

    /* Buttons */
    .btn-primary { background: linear-gradient(135deg, #d4af37, #b8941f); color: #111; padding: 13px 30px; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 15px; transition: transform 0.2s; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(212,175,55,0.3); }
    .btn-secondary { background: transparent; border: 1px solid rgba(212,175,55,0.3); color: #d4af37; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }

    /* Toast */
    .toast { position: fixed; bottom: 30px; right: 30px; padding: 14px 22px; border-radius: 8px; font-size: 14px; font-weight: 500; z-index: 9999; transform: translateY(100px); opacity: 0; transition: all 0.3s; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: #1a3a1a; border: 1px solid #4caf50; color: #4caf50; }
    .toast.error { background: #3a1a1a; border: 1px solid #f44336; color: #f44336; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: flex-start; z-index: 1000; overflow-y: auto; padding: 30px 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: #1a1a1a; border: 1px solid #d4af37; border-radius: 12px; padding: 25px; max-width: 800px; width: 100%; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { color: #d4af37; font-size: 1.4em; }

    /* Loading */
    .spinner-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 9998; }
    .spinner-overlay.active { display: flex; }
    .spinner { width: 48px; height: 48px; border: 4px solid rgba(212,175,55,0.2); border-top-color: #d4af37; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .form-grid, .form-grid.three { grid-template-columns: 1fr; }
      .ing-header, .ing-row { grid-template-columns: 1fr 80px 1fr 60px; }
    }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen active" id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <h1>🍸 The Bar Bible</h1>
      <p>Admin Dashboard</p>
    </div>
    <div class="login-group">
      <label>Email</label>
      <input type="text" id="login-email" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="login-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- MAIN APP (hidden until logged in) -->
<div id="main-app" style="display:none">

<div class="header">
  <div class="header-left">
    <h1>🍸 The Bar Bible</h1>
    <span>Admin Dashboard</span>
  </div>
  <div class="header-user">
    <span class="header-email" id="header-email"></span>
    <button class="btn-signout" onclick="doSignOut()">Sign out</button>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('browse')">Browse Cocktails</button>
    <button class="tab" onclick="switchTab('add')">Add Cocktail</button>
  </div>

  <!-- BROWSE TAB -->
  <div id="tab-browse" class="tab-content active">
    <div class="stats">
      <div class="stat"><div class="stat-num" id="stat-total">—</div><div class="stat-label">Total Cocktails</div></div>
      <div class="stat"><div class="stat-num" id="stat-premium">—</div><div class="stat-label">Premium</div></div>
      <div class="stat"><div class="stat-num" id="stat-free">—</div><div class="stat-label">Free</div></div>
    </div>
    <div class="search-bar">
      <input class="search-input" id="search" placeholder="Search cocktails..." oninput="renderGrid()">
      <select class="filter-select" id="filter-spirit" onchange="renderGrid()">
        <option value="">All Spirits</option>
        <option>Vodka</option><option>Gin</option><option>Rum</option>
        <option>Whiskey</option><option>Tequila</option><option>Brandy</option><option>Other</option>
      </select>
      <select class="filter-select" id="filter-method" onchange="renderGrid()">
        <option value="">All Methods</option>
        <option>Shake</option><option>Stir</option><option>Build</option><option>Roll</option>
      </select>
      <select class="filter-select" id="filter-premium" onchange="renderGrid()">
        <option value="">All</option>
        <option value="free">Free Only</option>
        <option value="premium">Premium Only</option>
      </select>
    </div>
    <div id="cocktail-grid" class="grid"><p style="color:#666">Loading...</p></div>
  </div>

  <!-- ADD TAB -->
  <div id="tab-add" class="tab-content">
    <div class="form-card">
      <h2>New Cocktail</h2>
      <div class="form-grid">
        <div class="form-group"><label>Name *</label><input type="text" id="f-name" placeholder="e.g. Espresso Martini"></div>
        <div class="form-group"><label>Cocktail Type *</label>
          <select id="f-category">
            <option value="cocktail">Cocktail</option>
            <option value="mocktail">Mocktail</option>
            <option value="shot">Shot</option>
          </select>
        </div>
        <div class="form-group"><label>Base Spirit *</label>
          <select id="f-spirit">
            <option value="">Select...</option>
            <option>Vodka</option><option>Gin</option><option>Rum</option><option>Whiskey</option>
            <option>Tequila</option><option>Brandy</option><option>Cachaca</option><option>Wine</option><option>Other</option>
          </select>
        </div>
        <div class="form-group"><label>Method *</label>
          <select id="f-method">
            <option value="">Select...</option>
            <option>Shake</option><option>Stir</option><option>Build</option><option>Roll</option><option>Blend</option><option>Throw</option>
          </select>
        </div>
        <div class="form-group"><label>Glass *</label><input type="text" id="f-glass" placeholder="e.g. Coupe, Rocks, Highball"></div>
        <div class="form-group"><label>Ice</label>
          <select id="f-ice">
            <option value="">Select...</option>
            <option>Cubed</option><option>Crushed</option><option>Cracked</option><option>Large Block</option><option>None</option>
          </select>
        </div>
        <div class="form-group"><label>Difficulty (1–5) *</label>
          <select id="f-difficulty">
            <option value="">Select...</option>
            <option value="1">1 — Very Easy</option><option value="2">2 — Easy</option>
            <option value="3">3 — Moderate</option><option value="4">4 — Difficult</option><option value="5">5 — Very Difficult</option>
          </select>
        </div>
        <div class="form-group"><label>Garnish</label><input type="text" id="f-garnish" placeholder="e.g. Orange twist"></div>
        <div class="form-group"><label>Tags (comma-separated)</label><input type="text" id="f-tags" placeholder="classic, bitter, aperitif"></div>
        <div class="form-group full"><label>Method Instructions *</label><textarea id="f-instructions" placeholder="Step-by-step preparation..."></textarea></div>
        <div class="form-group full"><label>History / Background</label><textarea id="f-history" placeholder="Origin story..."></textarea></div>
        <div class="form-group full"><label>Tasting Notes</label><textarea id="f-tasting" placeholder="Flavour profile description..." style="min-height:70px"></textarea></div>
      </div>
      <div class="toggle-row" style="margin-top:15px">
        <label class="toggle"><input type="checkbox" id="f-premium"><span class="toggle-slider"></span></label>
        <span class="toggle-label">Premium cocktail (locked for free users)</span>
      </div>
    </div>

    <div class="form-card">
      <h2>Ingredients</h2>
      <div class="ing-header">
        <span>Ingredient Name</span><span>Amount (ml)</span><span>Category</span><span></span>
      </div>
      <div id="ingredients-list"></div>
      <button class="btn-add-ing" onclick="addIngredientRow()">+ Add Ingredient</button>
    </div>

    <button class="btn-primary" onclick="submitCocktail()">🍸 Save Cocktail to Firestore</button>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Edit Cocktail</span>
      <button class="btn-secondary" onclick="closeModal()">Close</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

</div> <!-- /main-app -->

<!-- SPINNER -->
<div class="spinner-overlay" id="spinner"><div class="spinner"></div></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCVwW27JqSXcpQkPN4hrokN-WfSC51TmmQ",
    authDomain: "the-bar-bible-a7b98.firebaseapp.com",
    projectId: "the-bar-bible-a7b98",
    storageBucket: "the-bar-bible-a7b98.firebasestorage.app",
    messagingSenderId: "880092017001",
    appId: "1:880092017001:web:0f913c159b81755d4ccdf8",
    measurementId: "G-G5ZDPDS8P3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  const CATEGORIES = ['Spirits','Liqueurs','Citrus','Juices','Sweeteners','Mixers','Bitters','Coffee','Other'];
  let allCocktails = [];

  // Auth
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('login-screen').classList.remove('active');
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('header-email').textContent = user.email;
      loadCocktails();
    } else {
      document.getElementById('login-screen').classList.add('active');
      document.getElementById('main-app').style.display = 'none';
    }
  });

  window.doLogin = async function() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    const btn = document.getElementById('btn-login');

    errEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch(e) {
      errEl.textContent = 'Invalid email or password.';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  };

  document.getElementById('login-password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') window.doLogin();
  });

  window.doSignOut = async function() {
    await signOut(auth);
  };

  // Helpers
  function nameToId(name) {
    return name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  }

  function showSpinner() { document.getElementById('spinner').classList.add('active'); }
  function hideSpinner() { document.getElementById('spinner').classList.remove('active'); }

  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type} show`;
    setTimeout(() => el.classList.remove('show'), 3500);
  }

  // Tab switching
  window.switchTab = function(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (tab === 'browse' && i === 0) || (tab === 'add' && i === 1)));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    if (tab === 'browse') loadCocktails();
  };

  // Load & render
  async function loadCocktails() {
    showSpinner();
    try {
      const snap = await getDocs(collection(db, 'cocktails'));
      allCocktails = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      allCocktails.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      updateStats();
      renderGrid();
    } catch(e) {
      toast('Failed to load cocktails: ' + e.message, 'error');
    }
    hideSpinner();
  }

  function updateStats() {
    const premium = allCocktails.filter(c => c.is_premium).length;
    document.getElementById('stat-total').textContent = allCocktails.length;
    document.getElementById('stat-premium').textContent = premium;
    document.getElementById('stat-free').textContent = allCocktails.length - premium;
  }

  window.renderGrid = function() {
    const search = document.getElementById('search').value.toLowerCase();
    const spirit = document.getElementById('filter-spirit').value;
    const method = document.getElementById('filter-method').value;
    const prem = document.getElementById('filter-premium').value;

    let filtered = allCocktails.filter(c => {
      if (search && !c.name?.toLowerCase().includes(search)) return false;
      if (spirit && c.base_spirit !== spirit) return false;
      if (method && c.method !== method) return false;
      if (prem === 'free' && c.is_premium) return false;
      if (prem === 'premium' && !c.is_premium) return false;
      return true;
    });

    const grid = document.getElementById('cocktail-grid');
    if (!filtered.length) { grid.innerHTML = '<p style="color:#666">No cocktails found.</p>'; return; }

    grid.innerHTML = filtered.map(c => `
      <div class="card">
        <div class="card-actions">
          <button class="btn-sm btn-edit" onclick="editCocktail('${c.id}')">Edit</button>
          <button class="btn-sm btn-delete" onclick="deleteCocktail('${c.id}','${c.name?.replace(/'/g,"\\'")}')">Delete</button>
        </div>
        <div class="card-name">${c.name || 'Unnamed'}</div>
        <div class="card-meta">
          ${c.base_spirit ? `<span class="tag">${c.base_spirit}</span>` : ''}
          ${c.method ? `<span class="tag">${c.method}</span>` : ''}
          ${c.glass ? `<span class="tag">${c.glass}</span>` : ''}
          ${'★'.repeat(c.difficulty || 1).padEnd(5,'☆')}
          ${c.is_premium ? '<span class="tag premium">⭐ Premium</span>' : '<span class="tag">Free</span>'}
        </div>
      </div>
    `).join('');
  };

  // Ingredient rows
  function categoryOptions(selected = '') {
    return CATEGORIES.map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
  }

  window.addIngredientRow = function(name = '', amount = '', category = '') {
    const row = document.createElement('div');
    row.className = 'ing-row';
    row.innerHTML = `
      <input type="text" placeholder="e.g. Vodka" value="${name}" class="ing-name">
      <input type="number" placeholder="45" value="${amount}" class="ing-amount" min="0" step="0.5">
      <select class="ing-category"><option value="">Category...</option>${categoryOptions(category)}</select>
      <button class="btn-remove-ing" onclick="this.closest('.ing-row').remove()">Remove</button>
    `;
    document.getElementById('ingredients-list').appendChild(row);
  };

  function getIngredients(containerId = 'ingredients-list') {
    const rows = document.getElementById(containerId).querySelectorAll('.ing-row');
    return Array.from(rows).map(r => ({
      name: r.querySelector('.ing-name').value.trim(),
      amount_ml: parseFloat(r.querySelector('.ing-amount').value) || 0,
      category: r.querySelector('.ing-category').value,
    })).filter(i => i.name);
  }

  // Submit new cocktail
  window.submitCocktail = async function() {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { toast('Name is required', 'error'); return; }
    if (!document.getElementById('f-spirit').value) { toast('Base spirit is required', 'error'); return; }
    if (!document.getElementById('f-method').value) { toast('Method is required', 'error'); return; }
    if (!document.getElementById('f-glass').value.trim()) { toast('Glass is required', 'error'); return; }
    if (!document.getElementById('f-difficulty').value) { toast('Difficulty is required', 'error'); return; }

    const ingredients = getIngredients();
    if (!ingredients.length) { toast('Add at least one ingredient', 'error'); return; }

    const tags = document.getElementById('f-tags').value.split(',').map(t => t.trim()).filter(Boolean);
    const cleanName = name.toLowerCase().replace(/[^a-z0-9]/g, '');

    const data = {
      name,
      category: document.getElementById('f-category').value,
      base_spirit: document.getElementById('f-spirit').value,
      method: document.getElementById('f-method').value,
      glass: document.getElementById('f-glass').value.trim(),
      ice: document.getElementById('f-ice').value,
      difficulty: parseInt(document.getElementById('f-difficulty').value),
      garnish: document.getElementById('f-garnish').value.trim(),
      tags,
      method_instructions: document.getElementById('f-instructions').value.trim(),
      history: document.getElementById('f-history').value.trim(),
      tasting_notes: document.getElementById('f-tasting').value.trim(),
      tiles_notes: '',
      image_path: `assets/images/cocktails/${cleanName}`,
      is_premium: document.getElementById('f-premium').checked,
      ingredients,
    };

    showSpinner();
    try {
      const docId = nameToId(name);
      await setDoc(doc(db, 'cocktails', docId), data);

      const ingRef = collection(db, 'ingredients');
      for (const ing of ingredients) {
        if (ing.name && ing.category) {
          await setDoc(doc(ingRef, nameToId(ing.name)), { name: ing.name, category: ing.category }, { merge: true });
        }
      }

      toast(`✓ "${name}" saved to Firestore`);
      resetForm();
    } catch(e) {
      toast('Error: ' + e.message, 'error');
    }
    hideSpinner();
  };

  function resetForm() {
    ['f-name','f-glass','f-garnish','f-tags','f-instructions','f-history','f-tasting'].forEach(id => document.getElementById(id).value = '');
    ['f-category','f-spirit','f-method','f-ice','f-difficulty'].forEach(id => document.getElementById(id).selectedIndex = 0);
    document.getElementById('f-premium').checked = false;
    document.getElementById('ingredients-list').innerHTML = '';
    addIngredientRow();
  }

  // Edit cocktail
  window.editCocktail = function(id) {
    const c = allCocktails.find(x => x.id === id);
    if (!c) return;

    document.getElementById('modal-title').textContent = `Edit: ${c.name}`;

    const ings = (c.ingredients || []).map(i =>
      `<div class="ing-row">
        <input type="text" class="ing-name" value="${i.name || ''}">
        <input type="number" class="ing-amount" value="${i.amount_ml || 0}" min="0" step="0.5">
        <select class="ing-category"><option value="">Category...</option>${categoryOptions(i.category)}</select>
        <button class="btn-remove-ing" onclick="this.closest('.ing-row').remove()">Remove</button>
      </div>`
    ).join('');

    document.getElementById('modal-body').innerHTML = `
      <div class="form-grid" style="margin-bottom:15px">
        <div class="form-group"><label>Name</label><input type="text" id="e-name" value="${c.name || ''}"></div>
        <div class="form-group"><label>Cocktail Type</label>
          <select id="e-category">
            ${[
              { value: 'cocktail', label: 'Cocktail' },
              { value: 'mocktail', label: 'Mocktail' },
              { value: 'shot', label: 'Shot' },
            ].map(t => `<option value="${t.value}" ${(c.category || 'cocktail')===t.value?'selected':''}>${t.label}</option>`).join('')}
          </select></div>
        <div class="form-group"><label>Base Spirit</label>
          <select id="e-spirit"><option value="">Select...</option>
            ${['Vodka','Gin','Rum','Whiskey','Tequila','Brandy','Cachaca','Wine','Other'].map(s => `<option ${c.base_spirit===s?'selected':''}>${s}</option>`).join('')}
          </select></div>
        <div class="form-group"><label>Method</label>
          <select id="e-method"><option value="">Select...</option>
            ${['Shake','Stir','Build','Roll','Blend','Throw'].map(m => `<option ${c.method===m?'selected':''}>${m}</option>`).join('')}
          </select></div>
        <div class="form-group"><label>Glass</label><input type="text" id="e-glass" value="${c.glass || ''}"></div>
        <div class="form-group"><label>Ice</label>
          <select id="e-ice">
            ${['','Cubed','Crushed','Cracked','Large Block','None'].map(v => `<option value="${v}" ${c.ice===v?'selected':''}>${v||'Select...'}</option>`).join('')}
          </select></div>
        <div class="form-group"><label>Difficulty</label>
          <select id="e-difficulty">
            ${[1,2,3,4,5].map(n => `<option value="${n}" ${c.difficulty===n?'selected':''}>${n}</option>`).join('')}
          </select></div>
        <div class="form-group"><label>Garnish</label><input type="text" id="e-garnish" value="${c.garnish || ''}"></div>
        <div class="form-group"><label>Tags</label><input type="text" id="e-tags" value="${(c.tags||[]).join(', ')}"></div>
        <div class="form-group full"><label>Method Instructions</label><textarea id="e-instructions">${c.method_instructions || ''}</textarea></div>
        <div class="form-group full"><label>History</label><textarea id="e-history">${c.history || ''}</textarea></div>
        <div class="form-group full"><label>Tasting Notes</label><textarea id="e-tasting" style="min-height:70px">${c.tasting_notes || ''}</textarea></div>
      </div>
      <div class="toggle-row">
        <label class="toggle"><input type="checkbox" id="e-premium" ${c.is_premium?'checked':''}><span class="toggle-slider"></span></label>
        <span class="toggle-label">Premium cocktail</span>
      </div>
      <div style="margin-top:20px">
        <div class="ing-header"><span>Ingredient</span><span>Amount (ml)</span><span>Category</span><span></span></div>
        <div id="edit-ings">${ings}</div>
        <button class="btn-add-ing" onclick="addEditIngRow()">+ Add Ingredient</button>
      </div>
      <button class="btn-primary" onclick="saveEdit('${id}')">✓ Save Changes</button>
    `;

    document.getElementById('edit-modal').classList.add('active');
  };

  window.addEditIngRow = function() {
    const row = document.createElement('div');
    row.className = 'ing-row';
    row.innerHTML = `
      <input type="text" class="ing-name" placeholder="Ingredient">
      <input type="number" class="ing-amount" placeholder="0" min="0" step="0.5">
      <select class="ing-category"><option value="">Category...</option>${categoryOptions()}</select>
      <button class="btn-remove-ing" onclick="this.closest('.ing-row').remove()">Remove</button>
    `;
    document.getElementById('edit-ings').appendChild(row);
  };

  window.saveEdit = async function(id) {
    const name = document.getElementById('e-name').value.trim();
    if (!name) { toast('Name is required', 'error'); return; }

    const tags = document.getElementById('e-tags').value.split(',').map(t => t.trim()).filter(Boolean);
    const ingredients = getIngredients('edit-ings');

    const data = {
      name,
      category: document.getElementById('e-category').value,
      base_spirit: document.getElementById('e-spirit').value,
      method: document.getElementById('e-method').value,
      glass: document.getElementById('e-glass').value.trim(),
      ice: document.getElementById('e-ice').value,
      difficulty: parseInt(document.getElementById('e-difficulty').value),
      garnish: document.getElementById('e-garnish').value.trim(),
      tags,
      method_instructions: document.getElementById('e-instructions').value.trim(),
      history: document.getElementById('e-history').value.trim(),
      tasting_notes: document.getElementById('e-tasting').value.trim(),
      is_premium: document.getElementById('e-premium').checked,
      ingredients,
    };

    showSpinner();
    try {
      await updateDoc(doc(db, 'cocktails', id), data);

      const ingRef = collection(db, 'ingredients');
      for (const ing of ingredients) {
        if (ing.name && ing.category) {
          await setDoc(doc(ingRef, nameToId(ing.name)), { name: ing.name, category: ing.category }, { merge: true });
        }
      }

      toast(`✓ "${name}" updated`);
      closeModal();
      loadCocktails();
    } catch(e) {
      toast('Error: ' + e.message, 'error');
    }
    hideSpinner();
  };

  window.closeModal = function() {
    document.getElementById('edit-modal').classList.remove('active');
  };

  // Delete
  window.deleteCocktail = async function(id, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    showSpinner();
    try {
      await deleteDoc(doc(db, 'cocktails', id));
      toast(`"${name}" deleted`);
      loadCocktails();
    } catch(e) {
      toast('Error: ' + e.message, 'error');
    }
    hideSpinner();
  };

  // Init
  addIngredientRow();
</script>
</body>
</html>
